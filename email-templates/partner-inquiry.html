<!--
  Asian Social Rotterdam — パートナー問い合わせ通知（EmailJS テンプレート②）
  これは「自分に届く」通知メールなので、読みやすさ優先のシンプルな作りです。

  テンプレートの設定欄:
    To Email  : info@sym-arch.com
    From Name : Asian Social Rotterdam Website
    Reply To  : {{reply_to}}
    Subject   : {{subject}}

  変数: {{company}} {{name}} {{email}} {{topic}} {{website}} {{message}}
-->
<div style="margin:0;padding:24px 12px;background-color:#f2ece3;">
  <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" align="center"
         style="width:600px;max-width:100%;background-color:#ffffff;font-family:Helvetica,Arial,sans-serif;">
    <tr>
      <td style="padding:26px 28px 8px 28px;">
        <div style="font-size:11px;font-weight:bold;letter-spacing:2.4px;text-transform:uppercase;color:#c10e2e;">
          Partner inquiry
        </div>
        <h1 style="margin:12px 0 0 0;font-size:22px;line-height:1.25;color:#0e0b14;">{{company}}</h1>
      </td>
    </tr>
    <tr>
      <td style="padding:18px 28px 0 28px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
          <tr>
            <td width="92" style="padding:10px 0;border-top:1px solid #e6e0d6;font-size:10px;font-weight:bold;letter-spacing:1.6px;text-transform:uppercase;color:#7a7288;vertical-align:top;">Name</td>
            <td style="padding:10px 0;border-top:1px solid #e6e0d6;font-size:15px;color:#0e0b14;">{{name}}</td>
          </tr>
          <tr>
            <td style="padding:10px 0;border-top:1px solid #e6e0d6;font-size:10px;font-weight:bold;letter-spacing:1.6px;text-transform:uppercase;color:#7a7288;vertical-align:top;">Email</td>
            <td style="padding:10px 0;border-top:1px solid #e6e0d6;font-size:15px;"><a href="mailto:{{email}}" style="color:#c10e2e;">{{email}}</a></td>
          </tr>
          <tr>
            <td style="padding:10px 0;border-top:1px solid #e6e0d6;font-size:10px;font-weight:bold;letter-spacing:1.6px;text-transform:uppercase;color:#7a7288;vertical-align:top;">Type</td>
            <td style="padding:10px 0;border-top:1px solid #e6e0d6;font-size:15px;color:#0e0b14;">{{topic}}</td>
          </tr>
          <tr>
            <td style="padding:10px 0;border-top:1px solid #e6e0d6;border-bottom:1px solid #e6e0d6;font-size:10px;font-weight:bold;letter-spacing:1.6px;text-transform:uppercase;color:#7a7288;vertical-align:top;">Website</td>
            <td style="padding:10px 0;border-top:1px solid #e6e0d6;border-bottom:1px solid #e6e0d6;font-size:15px;color:#0e0b14;">{{website}}</td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:22px 28px 30px 28px;font-size:15px;line-height:1.65;color:#3a3348;white-space:pre-line;">{{message}}</td>
    </tr>
  </table>
</div>
